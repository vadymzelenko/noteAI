<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-accent="mono">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>NodeFlow — задачи и заметки</title>
  <meta name="description" content="NodeFlow — быстрый менеджер задач, заметок и ссылок с markdown и синхронизацией.">

  <meta name="theme-color" content="#09090b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:; base-uri 'self'; form-action 'self'; object-src 'none'">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="/js/theme-boot.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">nf</div>
      <span class="brand-name">NodeFlow</span>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="searchBtn" title="Поиск ( / )" aria-label="Поиск">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Светлая / тёмная тема" aria-label="Сменить тему">
        <svg class="ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Настройки" aria-label="Настройки">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      </button>
      <button class="account-chip" id="accountBtn" title="Аккаунт">
        <span class="auth-avatar" id="authAvatar" hidden></span>
        <svg id="authIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="authLabel">Войти</span>
      </button>
    </div>
  </header>

  <nav class="tabs" id="modeTabs" aria-label="Раздел">
    <span class="tabs-indicator" aria-hidden="true"></span>
    <button type="button" data-mode="tasks" class="active">Задачи</button>
    <button type="button" data-mode="notes">Заметки</button>
    <button type="button" data-mode="links">Ссылки</button>
  </nav>

  <main class="view" id="viewRoot"></main>
</div>

<!-- FAB — быстрая кнопка добавления на телефонах -->
<button class="fab" id="fabAdd" title="Добавить" aria-label="Добавить">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- ================= Редактор записи ================= -->
<div class="modal-overlay editor-overlay" id="editorOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Редактор">
  <div class="modal editor" id="editorModal">
    <header class="editor-head">
      <div class="seg" id="editorTypeSwitch" role="tablist">
        <span class="seg-indicator" aria-hidden="true"></span>
        <button type="button" data-type="task" class="active">Задача</button>
        <button type="button" data-type="note">Заметка</button>
      </div>
      <span class="save-state" id="saveState" role="status" aria-live="polite"></span>
      <div class="editor-head-actions">
        <button class="icon-btn" id="editorDelete" title="В корзину" aria-label="В корзину">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
        <button class="icon-btn" id="editorClose" title="Закрыть (Esc)" aria-label="Закрыть">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </header>

    <div class="editor-scroll" id="editorScroll">
      <input class="editor-title" id="editorTitle" type="text" placeholder="Заголовок" autocomplete="off" enterkeyhint="next">

      <div class="task-meta" id="taskMeta">
        <label class="pill-field deadline-pill" id="deadlinePill" title="Дедлайн">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span class="pill-label" id="deadlineLabel">Дедлайн</span>
          <input id="editorDeadline" type="datetime-local" aria-label="Дедлайн">
        </label>
        <button type="button" class="pill-clear" id="deadlineClear" title="Убрать дедлайн" aria-label="Убрать дедлайн" hidden>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>

        <div class="imp-switch" id="impSwitch" role="radiogroup" aria-label="Важность">
          <button type="button" data-imp="green" role="radio"><span class="dot"></span>Обычная</button>
          <button type="button" data-imp="red" role="radio"><span class="dot"></span>Важная</button>
        </div>

        <button type="button" class="pill-field done-pill" id="doneToggle" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Выполнено</span>
        </button>
      </div>

      <div class="toolbar" id="editorToolbar" role="toolbar" aria-label="Форматирование"></div>

      <textarea class="editor-body" id="editorBody" placeholder="Просто пиши…" spellcheck="true"></textarea>
      <div class="editor-preview md" id="editorPreview" hidden></div>
    </div>

    <footer class="editor-foot">
      <span class="char-count" id="charCount" aria-hidden="true"></span>
      <button class="btn primary" id="editorDone">Готово</button>
    </footer>
  </div>
</div>

<!-- ================= Ссылка: правка ================= -->
<div class="modal-overlay" id="linkOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Ссылка">
  <div class="modal modal-sm">
    <header class="modal-head">
      <h2 class="modal-title">Ссылка</h2>
      <button class="icon-btn" data-close title="Закрыть" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="modal-body" id="linkBody"></div>
  </div>
</div>

<!-- ================= Аккаунт ================= -->
<div class="modal-overlay" id="accountOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Аккаунт">
  <div class="modal modal-sm">
    <header class="modal-head">
      <h2 class="modal-title">Аккаунт</h2>
      <button class="icon-btn" data-close title="Закрыть" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="modal-body" id="accountBody"></div>
  </div>
</div>

<!-- ================= Настройки ================= -->
<div class="modal-overlay" id="settingsOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Настройки">
  <div class="modal">
    <header class="modal-head">
      <h2 class="modal-title">Настройки</h2>
      <button class="icon-btn" data-close title="Закрыть" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="modal-body" id="settingsBody"></div>
  </div>
</div>

<!-- ================= Аналитика ================= -->
<div class="modal-overlay" id="metricsOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Аналитика">
  <div class="modal modal-lg">
    <header class="modal-head">
      <h2 class="modal-title">Аналитика</h2>
      <button class="icon-btn" data-close title="Закрыть" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="modal-body" id="metricsBody"></div>
  </div>
</div>

<!-- ================= Корзина ================= -->
<div class="modal-overlay" id="trashOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Корзина">
  <div class="modal">
    <header class="modal-head">
      <h2 class="modal-title">Корзина</h2>
      <button class="icon-btn" data-close title="Закрыть" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="modal-body">
      <p class="hint">Удалённые записи хранятся 14 дней, затем очищаются автоматически.</p>
      <div class="stack" id="trashList"></div>
    </div>
    <footer class="modal-foot">
      <button class="btn ghost danger" id="trashEmptyBtn">Очистить корзину</button>
    </footer>
  </div>
</div>

<!-- ================= Поиск ================= -->
<div class="modal-overlay search-overlay" id="searchOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Поиск">
  <div class="modal search-modal">
    <header class="search-head">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" placeholder="Поиск по задачам и заметкам…" autocomplete="off" aria-label="Поиск">
      <button class="icon-btn" data-close title="Закрыть" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="search-filters">
      <div class="chips" id="searchType">
        <button class="chip active" data-type="all">Все</button>
        <button class="chip" data-type="task">Задачи</button>
        <button class="chip" data-type="note">Заметки</button>
        <button class="chip" data-type="red"><span class="dot red"></span>Важные</button>
        <button class="chip" data-type="done">Выполненные</button>
      </div>
    </div>
    <div class="modal-body search-results" id="searchBody"></div>
  </div>
</div>

<!-- ================= Командная палитра (Ctrl/⌘+K) ================= -->
<div class="modal-overlay palette-overlay" id="paletteOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Команды">
  <div class="modal palette">
    <div class="search-head">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="paletteInput" placeholder="Команда или запись…" autocomplete="off" aria-label="Команда или запись">
      <kbd>Esc</kbd>
    </div>
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>

<div class="toast-stack" id="toastStack" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/db.js"></script>
<script src="/js/links.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
